<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculadora-cb</title>
</head>
<body>
    <h1>Calculadora-cb</h1>
    <div id="calculadora">
        <button class="key-operador" data-action="add">+</button>
        <button class="key-operador" data-action="subtract">-</button>
        <button class="key-operador" data-action="multiply">x</button>
        <button class="key-operador" data-action="divide">/</button>
        <button class="key-valores">9</button>
        <button class="key-valores">8</button>
        <button class="key-valores">7</button>
        <button class="key-valores">6</button>
        <button class="key-valores">5</button>
        <button class="key-valores">4</button>
        <button class="key-valores">3</button>
        <button class="key-valores">2</button>
        <button class="key-valores">1</button>
        <button class="key-valores">0</button>
    </div>
</body>
</html>
